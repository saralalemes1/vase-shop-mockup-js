<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vase Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <!-- This is for the menu bar-->
         <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#material">About Material</a></li>
                <li><a href="#type">Vase Types</a></li> <!-- maybe instead of inside the menu, I could just use an elemet to sort it bt type, price, etc-->
                <li><a href="#recommendations">Recommendations of the Week</a></li>
                <li><a href="#about">About Us</a></li>
            </ul>
            
         </nav>
         
    </header>
    <section id="home">
        <div id="magic-realm" class="products">
            <p class="vase-name">Magic Realm</p>
            <img src="Magic Realm.png" alt="photo of a vase">
            <p class="vase-price">$108.50</p>
            <button class="minus">-</button>
            <p id="magic-realm-quantity" class="vase-quantity">0</p>
            <button class="plus">+</button>
        </div>
         <div id="mystical" class="products">
            <p class="vase-name">Mystical</p>
            <img src="mystical.png" alt="photo of a vase">
            <p class="vase-price">$108.50</p>
            <button class="minus">-</button>
            <p id="mystical-quantity" class="vase-quantity">0</p>
            <button class="plus">+</button>
        </div>
        <div id="cement-vase1" class="products">
            <p class="vase-name">Mayane Starlight</p>
            <img src="cement_vase1.png" alt="photo of a cement vase">
            <p class="vase-price">$98.50</p>
            <button class="minus">-</button>
            <p id="cement-vase-quantity-1" class="vase-quantity">0</p>
            <button class="plus">+</button>
        </div>
         <div id="cement-vase2" class="products">
            <p class="vase-name">Bryenne Waterfall</p>
            <img src="cement_vase2.png" alt="photo of a cement vase">
            <p class="vase-price">$98.50</p>
            <button class="minus">-</button>
            <p id="cement-vase-quantity-2" class="vase-quantity">0</p>
            <button class="plus">+</button>
        </div>
         <div id="wooden-vase1" class="products">
            <p class="vase-name">Treehouse</p>
            <img src="wooden_vase1.png" alt="photo of a wooden vase">
            <p class="vase-price">$150.00</p>
            <button class="minus">-</button>
            <p id="wooden-vase-quantity-1" class="vase-quantity">0</p>
            <button class="plus">+</button>
        </div>
         <div id="wooden-vase2" class="products">
            <p class="vase-name">Soft Pine Vase</p>
            <img src="wooden_vase2.png" alt="photo of a wooden vase">
            <p class="vase-price">$150.00</p>
            <button class="minus">-</button>
            <p id="wooden-vase-quantity-2" class="vase-quantity">0</p>
            <button class="plus">+</button>
        </div>
        <!-- This is for the main part where the products are displayed -->
    </section>
    <section id="material"><!-- This is for the main body -->

    </section>
    <section id="type"><!-- This is for the main body -->

    </section>
    <section id="recommendations"><!-- This is for the main body -->

    </section>
    <section id="about"><!-- This is for the main body -->

    </section>
    <section id="checkout">
        <!--This is for the checkout-->
    </section>
    
</body>
</html>
